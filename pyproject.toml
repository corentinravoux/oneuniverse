[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oneuniverse"
version = "0.2.0"
description = "Unified galaxy survey catalog package for low-redshift cosmology"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Corentin Ravoux"},
]

dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "astropy>=5.0",
    "pyarrow>=12.0",
    "healpy>=1.16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fits = ["fitsio>=1.1"]
all = [
    "fitsio>=1.1",
    "pyarrow>=12.0",
    "healpy>=1.16",
    "matplotlib>=3.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist>=3.0",
    "fitsio>=1.1",
    "pyarrow>=12.0",
    "healpy>=1.16",
    "matplotlib>=3.5",
    # Phase 21: multi-order MOC HEALPix support for GW skymap ingest.
    "mocpy>=0.13",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

# Third-party survey loaders register here so they can ship as separate
# installable packages and be discovered at import time. Built-in loaders of the
# same name always win (see oneuniverse._registry.Registry.load_entry_points):
#
#   [project.entry-points."oneuniverse.survey_loaders"]
#   my_survey = "my_pkg.loader:MySurveyLoader"
[project.entry-points."oneuniverse.survey_loaders"]
# (group reserved for community loaders; built-ins are imported directly)

[tool.setuptools.packages.find]
include = ["oneuniverse*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"
