[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "oneuniverse"
dynamic = ["version"]
description = "Unified galaxy survey catalog package for low-redshift cosmology"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Corentin Ravoux", email = "corentin.ravoux.research@gmail.com"},
]

dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "astropy>=5.0",
    "pyarrow>=12.0",
    "healpy>=1.16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fits = ["fitsio>=1.1"]
all = [
    "fitsio>=1.1",
    "pyarrow>=12.0",
    "healpy>=1.16",
    "matplotlib>=3.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist>=3.0",
    "fitsio>=1.1",
    "pyarrow>=12.0",
    "healpy>=1.16",
    "matplotlib>=3.5",
    # Phase 21: multi-order MOC HEALPix support for GW skymap ingest.
    "mocpy>=0.13",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/corentinravoux/oneuniverse"
Documentation = "https://corentinravoux.github.io/oneuniverse/"
Repository = "https://github.com/corentinravoux/oneuniverse"
Issues = "https://github.com/corentinravoux/oneuniverse/issues"

# Third-party survey loaders register here so they can ship as separate
# installable packages and be discovered at import time. Built-in loaders of the
# same name always win (see oneuniverse._registry.Registry.load_entry_points):
#
#   [project.entry-points."oneuniverse.survey_loaders"]
#   my_survey = "my_pkg.loader:MySurveyLoader"
[project.entry-points."oneuniverse.survey_loaders"]
# (group reserved for community loaders; built-ins are imported directly)

[tool.setuptools.dynamic]
version = {attr = "oneuniverse.__version__"}

[tool.setuptools.packages.find]
include = ["oneuniverse*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "oneuniverse/__init__.py"
